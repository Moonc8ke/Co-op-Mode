<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Co-op Mode app icon: a little plum book with a coral heart, on the
       app's warm cream paper background. Flat shapes only, no text, so it
       stays readable at small sizes. This is the text source for the PNG
       icons: scripts/generate-icons.mjs renders it at build time. -->
  <rect width="512" height="512" fill="#fff7ed"/>

  <!-- Coral heart above the book -->
  <path fill="#f97066" d="M256 228 C210 190 158 158 158 116 C158 88 180 70 206 70 C230 70 248 84 256 100 C264 84 282 70 306 70 C332 70 354 88 354 116 C354 158 302 190 256 228 Z"/>

  <!-- Plum book cover (open book, dip in the middle) -->
  <path fill="#4a1942" d="M92 296 C146 274 206 274 256 296 C306 274 366 274 420 296 L420 404 C366 382 306 382 256 404 C206 382 146 382 92 404 Z"/>

  <!-- Cream pages, inset from the cover -->
  <path fill="#fff7ed" d="M108 302 C158 282 208 282 256 302 C304 282 354 282 404 302 L404 394 C354 374 304 374 256 394 C208 374 158 374 108 394 Z"/>

  <!-- Spine and page lines -->
  <path fill="none" stroke="#4a1942" stroke-width="6" stroke-linecap="round" d="M256 302 L256 394"/>
  <path fill="none" stroke="#4a1942" stroke-width="6" stroke-linecap="round" d="M132 322 C170 310 205 310 232 322"/>
  <path fill="none" stroke="#4a1942" stroke-width="6" stroke-linecap="round" d="M132 346 C170 334 205 334 232 346"/>
  <path fill="none" stroke="#4a1942" stroke-width="6" stroke-linecap="round" d="M280 322 C307 310 342 310 380 322"/>
  <path fill="none" stroke="#4a1942" stroke-width="6" stroke-linecap="round" d="M280 346 C307 334 342 334 380 346"/>
</svg>
